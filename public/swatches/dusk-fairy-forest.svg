<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-dusk-fairy-forest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1C44" />
      <stop offset="60%" stop-color="#7B4B94" />
      <stop offset="100%" stop-color="#E3A857" />
    </linearGradient>
    <pattern id="pattern-dusk-fairy-forest" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 L 40 20 L 20 40 Z" fill="none" stroke="#FDE8C7" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grad-dusk-fairy-forest)" />
  <rect width="400" height="300" fill="url(#pattern-dusk-fairy-forest)" />
  <!-- Festive Arch Motif -->
  <path d="M 50 300 L 50 140 Q 50 70 200 70 Q 350 70 350 140 L 350 300" fill="none" stroke="#FDE8C7" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 70 300 L 70 150 Q 70 90 200 90 Q 330 90 330 150 L 330 300" fill="none" stroke="#2E1C44" stroke-width="1" stroke-opacity="0.5" />
  <!-- Center Medallion -->
  <circle cx="200" cy="140" r="32" fill="#E3A857" fill-opacity="0.6" stroke="#FDE8C7" stroke-width="1.5" />
  <circle cx="200" cy="140" r="18" fill="none" stroke="#2E1C44" stroke-width="1" stroke-dasharray="3,3" />
  <!-- Text Label Plate -->
  <rect x="30" y="230" width="340" height="45" rx="8" fill="#1C1420" fill-opacity="0.65" backdrop-filter="blur(4px)" />
  <text x="200" y="258" text-anchor="middle" fill="#FFF8EE" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">Dusk Fairy Forest</text>
</svg>